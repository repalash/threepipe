name: Consumer types

# Type-checks the packed threepipe and @threepipe/plugin-tweakpane declarations in a consumer
# project under several TypeScript versions and tsconfig setups (scripts/check-consumer-types.mjs).
on:
  pull_request:
    branches: ["dev", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build plugin-tweakpane
        working-directory: plugins/tweakpane
        run: npm ci --ignore-scripts && npm run build
      - run: npm run test:types
