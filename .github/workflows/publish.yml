name: Publish packages to npm

# Publishes the core and each plugin whose version is not on npm, after approval of the npm-publish environment, with
# repalash/release-tools (a Discord notice with the approval link and a Claude review; npm trusted publishing).
# - partial: a plugin that fails to build is left out, with what depends on it; the others are published.
# - post-build must pass: the published declarations checked as a consumer, the docs.
# - The build also type-checks the examples (build-examples needs no secret: missing keys are empty).
# - Tags: v<version> for the core, <name>-<version> for a plugin (CONTRIBUTING.md, Publishing).
# npm trusted publisher of each package: this repository, workflow publish.yml, environment npm-publish.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# Runs queue: a newer push waits until the one before is approved, rejected or cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # tags
      id-token: write # npm trusted publishing
    uses: repalash/release-tools/.github/workflows/npm-release.yml@v1
    with:
      packages: . plugins/* !plugins/plugin-template-*
      build: npm ci && npm run build:release
      post-build: npm run test:types && npm run docs-all
      partial: true
      clean-package: true
      require-changelog: true
      tag-format: '{name}-{version}'
      root-tag-format: 'v{version}'
      node-version: '22'
    secrets: inherit
