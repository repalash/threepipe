name: Publish packages to npm

# Publishes the core and each plugin whose version is not on npm, after approval of the npm-publish environment, with
# repalash/release-tools (a Discord notice with the approval link and a Claude review; npm trusted publishing).
# - Each package builds with its docs (package-build, in dependency order). partial: one that fails is left out, with
#   what depends on it; the others are published.
# - post-build must pass: the published declarations checked as a consumer (the core with plugin-tweakpane, so a
#   tweakpane build failure stops the release). The examples' type check (build-examples needs no secret: missing keys
#   are empty) is a warning on the run, not a stop.
# - Tags: v<version> for the core, <name>-<version> for a plugin (CONTRIBUTING.md, Publishing).
# npm trusted publisher of each package: this repository, workflow publish.yml, environment npm-publish.

on:
  push:
    # lane/rNNN: a three.js upgrade lane publishes prerelease versions under its own dist-tag (lane-guard below)
    branches: ["master", "lane/r*"]
  workflow_dispatch:

permissions:
  contents: read

# Runs queue per branch: a newer push waits until the one before is approved, rejected or cancelled.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # A lane branch never publishes to `latest`: every package version that is not on npm yet must be a prerelease
  # with a publishConfig.tag (three-rNNN).
  lane-guard:
    if: github.ref_name != 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prerelease versions with a dist-tag only
        run: |
          node --input-type=module -e "
          import {readFileSync, readdirSync, existsSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const dirs = ['.', ...readdirSync('plugins').filter(d => !d.startsWith('plugin-template-')).map(d => 'plugins/' + d)]
          let bad = 0
          for (const dir of dirs) {
            if (!existsSync(dir + '/package.json')) continue
            const p = JSON.parse(readFileSync(dir + '/package.json', 'utf8'))
            if (p.private) continue
            let published = false
            try { published = execFileSync('npm', ['view', p.name + '@' + p.version, 'version'], {encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore']}).trim() === p.version } catch {}
            if (published) continue
            if (!/^[^+]*-/.test(p.version) || !p.publishConfig?.tag) { console.log('::error::' + p.name + '@' + p.version + ' would be published without a prerelease version and publishConfig.tag'); bad++ }
          }
          process.exit(bad ? 1 : 0)"

  release:
    needs: lane-guard
    # on master the guard is skipped
    if: ${{ !cancelled() && needs.lane-guard.result != 'failure' }}
    permissions:
      contents: write # tags
      id-token: write # npm trusted publishing
    uses: repalash/release-tools/.github/workflows/npm-release.yml@d1906c368826a9621f5852bbbf0aa38ec1ae0c0f # release-tools #8 (partial, root-tag-format, exclusions); @v1 once v1 moves to it
    with:
      packages: . plugins/* !plugins/plugin-template-*
      build: npm ci
      package-build: npm run build && npm run docs --if-present
      # test:types packs the core with plugin-tweakpane, which a release without tweakpane does not build
      post-build: (test -d plugins/tweakpane/dist || npm run build -w @threepipe/plugin-tweakpane) && npm run test:types && (npm run build-examples || echo "::warning::the examples do not type-check")
      partial: true
      clean-package: true
      require-changelog: true
      tag-format: '{name}-{version}'
      root-tag-format: 'v{version}'
      node-version: '22'
    secrets: inherit
