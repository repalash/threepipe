# Deploys services/cloud (cloud.threepipe.org, a Cloudflare Worker) when the `cloud` branch moves
# (git push origin dev:cloud), with repalash/release-tools: the check (typecheck, e2e) runs with no secrets, Discord gets
# the approval link, a Claude review and the commits since the last deploy, and the deploy runs npm run deploy:ci after
# approval of the cloud-deploy environment, with its two secrets. Setup: services/cloud/README.md, Deploy.
name: Deploy threepipe cloud

on:
  push:
    branches: [cloud]
    paths: ['services/cloud/**', '.github/workflows/deploy-cloud.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      deployments: read
    uses: repalash/release-tools/.github/workflows/deploy.yml@97a85f9970a90a25ca25d51bb6f1168c8fb81565 # release-tools #9 (deploy secrets by name); @v1 once v1 moves to it
    with:
      environment: cloud-deploy
      name: threepipe cloud
      working-directory: services/cloud
      check: npm ci && npm run typecheck && npm test
      install: npm ci
      deploy: npm run deploy:ci
      secrets-env: CLOUDFLARE_API_TOKEN ADMIN_SERVICE_TOKEN
      node-version: '22'
    secrets: # by name: the deploy job holds no other repository secret
      # secrets of the cloud-deploy environment: a reusable workflow gets them only when they are passed
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_SERVICE_TOKEN: ${{ secrets.ADMIN_SERVICE_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      CLAUDE_REVIEW_FIRE_URL: ${{ secrets.CLAUDE_REVIEW_FIRE_URL }}
      CLAUDE_REVIEW_TOKEN: ${{ secrets.CLAUDE_REVIEW_TOKEN }}
