# Deploys services/cloud (cloud.threepipe.org, a Cloudflare Worker) when the `cloud` branch moves
# (git push origin dev:cloud), with repalash/release-tools: the check (typecheck, e2e) runs with no secrets, Discord gets
# the approval link, a Claude review and the commits since the last deploy, and the deploy runs npm run deploy:ci after
# approval of the cloud-deploy environment, with its two secrets. Setup: services/cloud/README.md, Deploy.
name: Deploy threepipe cloud

on:
  push:
    branches: [cloud]
    paths: ['services/cloud/**', '.github/workflows/deploy-cloud.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      deployments: read
    uses: repalash/release-tools/.github/workflows/deploy.yml@v1
    with:
      environment: cloud-deploy
      name: threepipe cloud
      working-directory: services/cloud
      check: npm ci && npm run typecheck && npm test
      deploy: npm ci && npm run deploy:ci
      secrets-env: CLOUDFLARE_API_TOKEN ADMIN_SERVICE_TOKEN
      node-version: '22'
    secrets: inherit
