<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modelling Replay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/mesh-kernel": "./../../plugins/mesh-kernel/dist/index.mjs",
          "@threepipe/plugin-mesh-edit": "./../../plugins/mesh-edit/dist/index.mjs",
          "@threepipe/plugin-modelling": "./../../plugins/modelling/dist/index.mjs",
          "@threepipe/plugin-editor-engine": "./../../plugins/editor-engine/dist/index.mjs",
          "@threepipe/plugin-modelling-editor": "./../../plugins/modelling-editor/dist/index.mjs"
        }
    }
    </script>
    <style id="example-style">
        html, body, #editor {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #1c1d22;
        }
        .code-preview-container {
            position: fixed;
            left: 50%;
            top: 44px;
            z-index: 30;
        }
        #replay {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            z-index: 25;
            width: min(560px, 70vw);
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(30, 32, 38, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            color: #d8dade;
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        #replay .row { display: flex; align-items: center; gap: 8px; }
        #replay .title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #replay .bar { height: 4px; margin: 6px 0; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
        #replay .bar > div { height: 100%; width: 0; background: #e8913a; transition: width 0.1s linear; }
        #replay .step { color: #9aa0a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #replay .err { color: #ff8a80; }
        #replay button, #replay label {
            font: inherit; color: #d8dade; background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 2px 8px; cursor: pointer;
        }
        #replay button:hover, #replay label:hover { background: rgba(255, 255, 255, 0.12); }
        #replay input[type=file] { display: none; }
        body.dragging #replay { outline: 2px dashed #e8913a; }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script type="module" src="../examples-utils/simple-code-preview.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="editor"></div>
<div id="replay" data-replay>
    <div class="row">
        <span class="title" data-replay-title>Loading…</span>
        <button data-replay-toggle title="Pause / resume">Pause</button>
        <button data-replay-step title="Run one command">Step</button>
        <button data-replay-restart title="Clear the document and replay from the start">Restart</button>
        <label title="Replay a transcript.json, a command list or a .jsonl file - or drop one on the page">Open…<input type="file" accept=".json,.jsonl,application/json" data-replay-file></label>
    </div>
    <div class="bar"><div data-replay-bar></div></div>
    <div class="step" data-replay-status></div>
</div>
<div class="code-preview-container"></div>
</body>
</html>
