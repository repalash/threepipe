<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Layers Panel Plugin</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
          "@threepipe/plugin-tweakpane-editor": "./../../plugins/tweakpane-editor/dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        /* the layers on the left, the canvas next to them */
        #layers {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            border-right: 1px solid rgba(0, 0, 0, .1);
        }
        #canvas-container {
            position: fixed;
            left: 260px;
            top: 0;
            right: 0;
            bottom: 0;
        }
        #mcanvas {
            width: 100%;
            height: 100%;
        }
        /* a narrow window: the canvas on top, the layers below it */
        @media (max-width: 600px) {
            #layers {
                top: auto;
                right: 0;
                width: auto;
                height: 40%;
                border-right: 0;
                border-top: 1px solid rgba(0, 0, 0, .1);
            }
            #canvas-container {
                left: 0;
                bottom: 40%;
            }
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="layers"></div>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>

</body>
