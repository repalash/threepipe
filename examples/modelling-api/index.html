<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modelling command API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
          "@threepipe/mesh-kernel": "./../../plugins/mesh-kernel/dist/index.mjs",
          "@threepipe/plugin-mesh-edit": "./../../plugins/mesh-edit/dist/index.mjs",
          "@threepipe/plugin-modelling": "./../../plugins/modelling/dist/index.mjs"
        }
    }
    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body { font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6e6ea; }

        #console {
            position: absolute; left: 10px; bottom: 10px; width: 430px;
            background: rgba(18,18,22,0.92); border-radius: 8px; backdrop-filter: blur(6px);
            display: flex; flex-direction: column; z-index: 10; overflow: hidden;
        }
        #console header {
            display: flex; align-items: center; gap: 8px; padding: 7px 10px;
            border-bottom: 1px solid #33333d;
        }
        #console header b { font-weight: 600; letter-spacing: .04em; }
        #console header span { color: #8a8a96; }
        #log { height: 190px; overflow: auto; padding: 8px 10px; white-space: pre-wrap; }
        #log .ok { color: #9fd89f; }
        #log .err { color: #ff9c9c; }
        #log .cmd { color: #a8c4ff; }
        #log .warn { color: #ffcf6b; }
        #input {
            border: 0; border-top: 1px solid #33333d; background: #16161a; color: #e6e6ea;
            font: inherit; padding: 8px 10px; resize: vertical; height: 58px; outline: none;
        }
        #console footer { display: flex; gap: 6px; padding: 7px 10px; border-top: 1px solid #33333d; }
        button {
            padding: 4px 10px; border: 1px solid #3a3a44; border-radius: 4px;
            background: #26262e; color: #e6e6ea; font: inherit; cursor: pointer;
        }
        button:hover { background: #33333d; }

        #ops {
            position: absolute; top: 10px; left: 10px; width: 250px; max-height: 60vh; overflow: auto;
            background: rgba(18,18,22,0.9); border-radius: 8px; padding: 9px 11px;
            backdrop-filter: blur(6px); z-index: 10;
        }
        #ops h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; color: #8a8a96;
            text-transform: uppercase; font-weight: 600; }
        #ops .op { cursor: pointer; padding: 2px 0; }
        #ops .op:hover { color: #a8c4ff; }
        #ops .op code { color: #ffcf6b; }
        #ops .op em { color: #8a8a96; font-style: normal; }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script type="module" src="../examples-utils/simple-code-preview.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>

<div id="ops">
    <h4>Commands</h4>
    <div id="op-list">loading…</div>
</div>

<div id="console">
    <header><b>Command console</b><span id="doc-id"></span></header>
    <div id="log"></div>
    <textarea id="input" spellcheck="false">{"op": "primitive", "type": "cube", "name": "hull", "width": 2.45, "height": 0.95, "depth": 6.5}</textarea>
    <footer>
        <button id="run">Run  (Ctrl+Enter)</button>
        <button id="undo">Undo</button>
        <button id="capture">Capture</button>
        <button id="demo">Run demo build</button>
    </footer>
</div>

</body>
</html>
