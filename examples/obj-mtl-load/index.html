<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBJ MTL Load</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module">
        import {_testFinish, _testStart, DropzonePlugin, HemisphereLight, ThreeViewer} from 'threepipe'
        import {createExampleCard} from '../examples-utils/example-card.js'
        import {modelStats} from '../examples-utils/model-stats.js'


        const viewer = new ThreeViewer({
            canvas: document.getElementById('mcanvas'),
            msaa: true,
            // drop a file on the page (or Open file in the card) to load it in place of this one, with its .mtl and textures
            dropzone: {allowedExtensions: ['obj', 'mtl', 'png', 'jpg', 'jpeg', 'webp'], addOptions: {disposeSceneObjects: true, autoCenter: true, autoScale: true}},
        })

        async function init() {

            // in the root, not the model root: replacing the model (a drop, disposeSceneObjects) keeps the light
            viewer.scene.addObject(new HemisphereLight(0xffffff, 0x444444, 10), {addToRoot: true})
            const loadStart = performance.now()
            const result = await viewer.load('https://threejs.org/examples/models/obj/male02/male02.obj', {
                autoCenter: true,
                autoScale: true,
            })
            const loadMs = Math.round(performance.now() - loadStart)
            console.log(result)

            const stats = modelStats(viewer)
            createExampleCard(viewer, {
                description: 'Loads an OBJ file with its MTL materials and their textures, found next to the .obj (a model from the three.js examples). Drop or open another .obj.',
                actions: [
                    {type: 'button', label: 'Open file…', icon: 'file-code', value: () => viewer.getPlugin(DropzonePlugin)?.promptForFile()},
                    {type: 'monitor', label: 'Meshes', getValue: () => stats.meshes.toLocaleString()},
                    {type: 'monitor', label: 'Triangles', getValue: () => stats.triangles.toLocaleString()},
                    {type: 'monitor', label: 'Load time', getValue: () => `${loadMs} ms`},
                ],
            })

        }

        _testStart()
        init().finally(_testFinish)
    </script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>

</body>
