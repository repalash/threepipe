<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection UX Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "three": "./../../dist/index.mjs",
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
          "@threepipe/plugin-tweakpane-editor": "./../../plugins/tweakpane-editor/dist/index.mjs",
          "@threepipe/plugins-extra-importers": "./../../plugins/extra-importers/dist/index.js",
          "@threepipe/plugin-blend-importer": "./../../plugins/blend-importer/dist/index.mjs",
          "@threepipe/plugin-geometry-generator": "./../../plugins/geometry-generator/dist/index.mjs",
          "@threepipe/plugin-configurator": "./../../plugins/configurator/dist/index.mjs",
          "@threepipe/plugin-network": "./../../plugins/network/dist/index.mjs",
          "@threepipe/plugin-gltf-transform": "./../../plugins/gltf-transform/dist/index.mjs",
          "@threepipe/plugin-gaussian-splatting": "./../../plugins/gaussian-splatting/dist/index.mjs",
          "@threepipe/plugin-3d-tiles-renderer": "./../../plugins/3d-tiles-renderer/dist/index.mjs",
          "@threepipe/plugin-assimpjs": "./../../plugins/assimpjs/dist/index.mjs",
          "@threepipe/plugin-path-tracing": "./../../plugins/path-tracing/dist/index.mjs",
          "@threepipe/plugin-timeline-ui": "./../../plugins/timeline-ui/dist/index.mjs",
          "@threepipe/plugin-troika-text": "./../../plugins/troika-text/dist/index.mjs",
          "@threepipe/webgi-plugins": "./../../plugins/webgi-plugins/dist/index.mjs"
        }
    }

    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">

    <style id="example-style">
        html {
            display: block;
            overscroll-behavior: contain;
            width: 100%;
            height: 100%;
        }
        /* the side panel (ui.ts) starts below the toolbar and ends above the webgi logo */
        #canvas-container .sux-side { top: 60px; bottom: 60px; }
        /* the toolbar has Expand */
        #fsToggle { display: none !important; }
        #canvas-container .sux-hint { bottom: 16px; }
        /* the modes are a coloured icon bar on the right (ModeBar.ts), the bottom buttons are in the toolbar */
        .mode-buttons-container, .util-buttons-container { display: none !important; }
        @media only screen and (min-width: 920px) {
            body #canvas-container {
                width: calc(100% - 3rem - 44px - max(var(--tweakpane-ui-container-width, 300px), 3rem)) !important;
                height: calc(100% - 3rem);
                margin: 1.5rem 1.5rem 1.5rem 1.5rem !important;
            }
            body #tweakpaneUiContainer { margin-top: 0 !important; right: 56px !important; }
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>
</body>
</html>
