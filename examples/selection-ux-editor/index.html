<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection UX Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "./../../dist/index.mjs",
            "threepipe": "./../../dist/index.mjs",
            "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
            "@threepipe/plugin-tweakpane-editor": "./../../plugins/tweakpane-editor/dist/index.mjs",
            "@threepipe/plugins-extra-importers": "./../../plugins/extra-importers/dist/index.js",
            "@threepipe/plugin-blend-importer": "./../../plugins/blend-importer/dist/index.mjs",
            "@threepipe/plugin-geometry-generator": "./../../plugins/geometry-generator/dist/index.mjs",
            "@threepipe/plugin-configurator": "./../../plugins/configurator/dist/index.mjs",
            "@threepipe/plugin-network": "./../../plugins/network/dist/index.mjs",
            "@threepipe/plugin-gltf-transform": "./../../plugins/gltf-transform/dist/index.mjs",
            "@threepipe/plugin-gaussian-splatting": "./../../plugins/gaussian-splatting/dist/index.mjs",
            "@threepipe/plugin-3d-tiles-renderer": "./../../plugins/3d-tiles-renderer/dist/index.mjs",
            "@threepipe/plugin-assimpjs": "./../../plugins/assimpjs/dist/index.mjs",
            "@threepipe/plugin-path-tracing": "./../../plugins/path-tracing/dist/index.mjs",
            "@threepipe/plugin-timeline-ui": "./../../plugins/timeline-ui/dist/index.mjs",
            "@threepipe/plugin-troika-text": "./../../plugins/troika-text/dist/index.mjs",
            "@threepipe/webgi-plugins": "./../../plugins/webgi-plugins/dist/index.mjs",
            "../selection-ux-playground/AnnotationsPlugin": "../selection-ux-playground/AnnotationsPlugin.js",
            "../selection-ux-playground/CameraPathPlugin": "../selection-ux-playground/CameraPathPlugin.js",
            "../selection-ux-playground/EditorToolbarPlugin": "../selection-ux-playground/EditorToolbarPlugin.js",
            "../selection-ux-playground/LayersPanelPlugin": "../selection-ux-playground/LayersPanelPlugin.js",
            "../selection-ux-playground/ModeBar": "../selection-ux-playground/ModeBar.js",
            "../selection-ux-playground/NotesPlugin": "../selection-ux-playground/NotesPlugin.js",
            "../selection-ux-playground/PenToolPlugin": "../selection-ux-playground/PenToolPlugin.js",
            "../selection-ux-playground/PerfPanelPlugin": "../selection-ux-playground/PerfPanelPlugin.js",
            "../selection-ux-playground/SceneOverrides": "../selection-ux-playground/SceneOverrides.js",
            "../selection-ux-playground/SelectionOutlinePlugin": "../selection-ux-playground/SelectionOutlinePlugin.js",
            "../selection-ux-playground/SelectionUxPlugin": "../selection-ux-playground/SelectionUxPlugin.js",
            "../selection-ux-playground/TimelineBarPlugin": "../selection-ux-playground/TimelineBarPlugin.js",
            "../selection-ux-playground/UiConfigForm": "../selection-ux-playground/UiConfigForm.js",
            "../selection-ux-playground/VariationsBarPlugin": "../selection-ux-playground/VariationsBarPlugin.js",
            "../selection-ux-playground/VideoRecorderPlugin": "../selection-ux-playground/VideoRecorderPlugin.js",
            "../selection-ux-playground/editorCamera": "../selection-ux-playground/editorCamera.js",
            "../selection-ux-playground/motionUi": "../selection-ux-playground/motionUi.js",
            "../selection-ux-playground/report": "../selection-ux-playground/report.js",
            "../selection-ux-playground/scene": "../selection-ux-playground/scene.js",
            "../selection-ux-playground/splash": "../selection-ux-playground/splash.js",
            "../selection-ux-playground/ui": "../selection-ux-playground/ui.js",
            "three-mesh-bvh": "https://esm.sh/three-mesh-bvh@0.9.16?external=three",
            "../tweakpane-editor/ThreeEditor": "../tweakpane-editor/ThreeEditor.js"
        }
    }

    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">

    <style id="example-style">
        html {
            display: block;
            overscroll-behavior: contain;
            width: 100%;
            height: 100%;
        }
        /* the side panel (ui.ts) starts below the toolbar and ends above the sticky notes bar and the perf pill */
        #canvas-container .sux-side { top: 60px; bottom: 104px; }
        /* the camera pill of EditorCameraPlugin below the toolbar, not over it */
        body .ecu-root { top: 64px; }
        /* the toasts of the selection (Lock, ...) below the camera pill and above it in the layers */
        #canvas-container .sux-toast { top: 100px; z-index: 130; }
        /* the toolbar has Expand */
        #fsToggle { display: none !important; }
        #canvas-container .sux-hint { bottom: 16px; }
        /* the bottom buttons are in the toolbar; the page frame, the mode bar and the panel come from TweakpaneEditorPlugin */
        .util-buttons-container { display: none !important; }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>
</body>
</html>
