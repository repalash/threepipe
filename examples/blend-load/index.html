<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blend Load</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-blend-importer": "./../../plugins/blend-importer/dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .blender-demo-credit { margin: 0 6px 4px !important; }
        .blender-demo-credit a { color: inherit; }
        .blend-scenes { display: flex; gap: 8px; align-items: center; margin: 0 6px 6px; color: var(--ec-dim); }
        .blend-scenes select { flex: 1; min-width: 0; font: inherit; }
        .blend-notes { margin: 6px 6px 0; color: var(--ec-dim); }
        .blend-notes summary { cursor: pointer; }
        .blend-notes ul { margin: 4px 0 0; padding-left: 16px; max-height: 120px; overflow-y: auto; }
        .blend-notes li { margin-bottom: 2px; word-break: break-word; }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>

</body>
