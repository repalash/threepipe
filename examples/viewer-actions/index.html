<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viewer Actions</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
          "@threepipe/plugin-tweakpane-editor": "./../../plugins/tweakpane-editor/dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        /* a small UI that lists the actions of the viewer (viewer.actions) with their keys, and the result of the last run;
           it is shown in the example card */
        #commands { font-weight: 500; }
        #commands button {
            display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 4px 6px; border: 0; border-radius: 4px;
            background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
        }
        #commands button:hover { background: rgba(127, 127, 127, .15); }
        #commands kbd { font: inherit; color: #8a8f97; }
        #result { margin: 6px 6px 0; color: #8a8f97; }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
    <div id="commands"><div id="list"></div><div id="result">Press a key, or click an action</div></div>
</div>

</body>
