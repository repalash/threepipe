<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Feedback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-cloud": "./../../plugins/cloud/dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #feedback-buttons {
            position: fixed;
            right: 12px;
            bottom: 12px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        #feedback-buttons button {
            font: 13px system-ui, sans-serif;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #0003;
            background: #fff;
            cursor: pointer;
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script type="module" src="../examples-utils/simple-code-preview.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>
<div id="feedback-buttons">
    <button id="report-problem" type="button">Report a problem</button>
    <button id="send-feedback" type="button">Send feedback</button>
</div>

</body>
