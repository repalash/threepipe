<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection UX Plugin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
          "@threepipe/plugin-tweakpane-editor": "./../../plugins/tweakpane-editor/dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .help {
            position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px; pointer-events: none;
            font: 12px/1.6 sans-serif; color: #333; background: rgba(255,255,255,.85);
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script type="module" src="../examples-utils/simple-code-preview.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
    <div class="help">
        Click: the group · Double click: one level in · Click again: the one behind · Shift: add/remove · Ctrl/Cmd: deepest<br>
        Esc / Shift+Enter: parent · Enter: children · Tab: next · Ctrl/Cmd+A: all at this level · Ctrl/Cmd+Z: undo
    </div>
</div>

</body>
