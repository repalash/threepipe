<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Material Preview</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #preview-panel {
            position: absolute;
            top: 12px;
            left: 12px; /* the Tweakpane UI (the plugin settings and the materials) is on the right */
            width: 280px;
            max-height: calc(100% - 24px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            background: rgba(24, 24, 28, 0.88);
            color: #eee;
            font: 12px/1.4 system-ui, sans-serif;
            z-index: 200;
        }
        #preview-panel h3 { margin: 0 0 8px; font-size: 13px; }
        #preview-panel .shapes { display: flex; gap: 4px; margin-bottom: 8px; }
        #preview-panel .shapes button { flex: 1; padding: 4px; border: 1px solid #555; border-radius: 4px; background: #333; color: #eee; cursor: pointer; }
        #preview-panel .shapes button.on { background: #4a6cf7; border-color: #4a6cf7; }
        #preview-panel .material { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid #444; }
        #preview-panel canvas.preview { width: 96px; height: 96px; flex: none; border-radius: 4px; background: repeating-conic-gradient(#3a3a3a 0 25%, #2a2a2a 0 50%) 0 0 / 16px 16px; }
        #preview-panel .controls { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        #preview-panel .time { color: #9a9; }
        #preview-panel .bench { margin-top: 8px; border-top: 1px solid #444; padding-top: 8px; }
        #preview-panel .bench button { width: 100%; padding: 4px; border: 1px solid #555; border-radius: 4px; background: #333; color: #eee; cursor: pointer; }
        #benchmark-images { display: flex; gap: 8px; margin-top: 6px; }
        #benchmark-images img { width: 96px; height: 96px; border-radius: 4px; background: #222; }
        #preview-panel pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 11px; }
        @media (max-width: 600px) {
            #preview-panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 45%; }
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>
<div id="preview-panel">
    <h3>Material previews</h3>
    <div class="shapes">
        <button data-shape="sphere" class="on">Sphere</button>
        <button data-shape="cube">Cube</button>
        <button data-shape="mesh">This mesh</button>
    </div>
    <div id="materials"></div>
    <div class="bench">
        <button id="benchmark">Benchmark: offscreen vs full canvas</button>
        <pre id="benchmark-result"></pre>
        <div id="benchmark-images"></div>
    </div>
</div>

</body>
