<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gaussian Splat Load</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-gaussian-splatting": "./../../plugins/gaussian-splatting/dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
          "@threepipe/plugin-tweakpane-editor": "./../../plugins/tweakpane-editor/dist/index.mjs"
        }
    }
    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module">
        import {_testFinish, _testStart, DropzonePlugin, LoadingScreenPlugin, ThreeViewer} from 'threepipe'
        import {createExampleCard} from '../examples-utils/example-card.js'
        import {GaussianSplattingPlugin} from '@threepipe/plugin-gaussian-splatting'


        const viewer = new ThreeViewer({
            canvas: document.getElementById('mcanvas'),
            // drop a file on the page (or Open file in the card) to load it in place of this one
            dropzone: {allowedExtensions: ['splat'], addOptions: {disposeSceneObjects: true, autoCenter: true, autoScale: true}},
            plugins: [LoadingScreenPlugin],
        })
        viewer.addPluginsSync([GaussianSplattingPlugin])

        async function init() {

            await viewer.setEnvironmentMap('https://samples.threepipe.org/minimal/venice_sunset_1k.hdr')
            const loadStart = performance.now()
            const result = await viewer.load('https://samples.threepipe.org/splat/bonsai.splat', {
                autoCenter: true,
                autoScale: true,
            })
            const loadMs = Math.round(performance.now() - loadStart)
            console.log(result)

            createExampleCard(viewer, {
                description: 'GaussianSplattingPlugin loads Gaussian splats (.splat) and renders them: a bonsai captured from photos. A splat is a cloud of soft coloured blobs, not triangles. Drop or open another .splat.',
                actions: [
                    {type: 'button', label: 'Open file…', icon: 'file-code', value: () => viewer.getPlugin(DropzonePlugin)?.promptForFile()},
                    {type: 'monitor', label: 'Load time', getValue: () => `${loadMs} ms`},
                ],
            })

        }

        _testStart()
        init().finally(_testFinish)
    </script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>

</body>
