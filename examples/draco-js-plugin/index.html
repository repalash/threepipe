<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Draco JS Decode Plugin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-draco-js": "./../../plugins/draco-js/dist/index.mjs"
        }
    }
    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script type="module" src="../examples-utils/simple-code-preview.mjs"></script>
    <script id="example-script" type="module">
        import {_testFinish, _testStart, LoadingScreenPlugin, ThreeViewer} from 'threepipe'
        import {DracoJSDecodePlugin, DRACOLoader2Pure} from '@threepipe/plugin-draco-js'

        const viewer = new ThreeViewer({canvas: document.getElementById('mcanvas')})
        viewer.addPluginSync(LoadingScreenPlugin)

        // Decode Draco meshes (.drc and glTF KHR_draco_mesh_compression) with the pure-JS draco.js
        // decoder instead of the default WASM decoder, with automatic WASM fallback.
        viewer.addPluginSync(DracoJSDecodePlugin)

        async function init() {

            await viewer.setEnvironmentMap('https://samples.threepipe.org/minimal/venice_sunset_1k.hdr')

            // A Draco-compressed glTF (KHR_draco_mesh_compression) — decoded here by draco.js.
            const result = await viewer.load('https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets/Models/WaterBottle/glTF-Draco/WaterBottle.gltf', {
                autoCenter: true,
                autoScale: true,
            })
            console.log(result, 'WASM fallbacks:', DRACOLoader2Pure.fallbackCount)
        }

        _testStart()
        init().finally(_testFinish)
    </script>
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>

</body>
</html>
