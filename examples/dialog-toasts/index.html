<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dialog Toasts</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        /* the controls of the example: buttons that show toasts, the place and the colour of the toasts */
        #toasts {
            position: absolute; left: 12px; bottom: 12px; z-index: 100; width: 220px; padding: 8px; border-radius: 6px;
            background: #ffffff; color: #1e1e1e; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.10);
            font: 500 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
        }
        #toasts button {
            display: block; width: 100%; padding: 4px 6px; border: 0; border-radius: 4px;
            background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
        }
        #toasts button:hover { background: #f2f3f5; }
        #toasts label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; color: #8a8f97; }
        #toasts input { flex: 1; min-width: 0; }
        /* toasts at the bottom centre: a CSS rule over the one of the dialog (the class is on the body, so it is for the
           toasts of the page and of the viewer); the newest toast is at the edge, and it comes in from below */
        .toasts-bottom .dialog-toasts { top: auto; bottom: 12px; }
        @media (prefers-reduced-motion: no-preference) { .toasts-bottom .dialog-toast { animation-name: toast-in-bottom; } }
        @keyframes toast-in-bottom { from { opacity: 0; transform: translateY(4px); } }
        /* on a phone, the panel goes to the top while the toasts are at the bottom, so that they do not cover it */
        @media (max-width: 600px) { .toasts-bottom #toasts { top: 12px; bottom: auto; } }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
    <div id="toasts"></div>
</div>

</body>
