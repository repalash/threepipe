<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Material Preview Lab</title>
    <link rel="help" type="text/plain" href="../llms.txt" title="For agents: about threepipe, the source of this example and how to use it">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #lab {
            position: absolute;
            top: 12px;
            left: 12px; /* the Tweakpane UI (the plugin settings and the material on the vase) is on the right */
            width: 300px;
            max-height: calc(100% - 24px);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            background: rgba(22, 22, 26, 0.9);
            color: #eee;
            font: 12px/1.4 system-ui, sans-serif;
            z-index: 200;
        }
        #lab h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
        .active { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        #large { width: 96px; height: 96px; flex: none; border-radius: 8px; background: repeating-conic-gradient(#3a3a3a 0 25%, #2c2c2c 0 50%) 0 0 / 16px 16px; }
        .active div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .active small { color: #888; }
        #active-time { color: #9a9; }
        #palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; overflow-y: auto; min-height: 0; padding: 2px; }
        .swatch { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; border: 1px solid transparent; border-radius: 6px; background: #26262b; color: #ccc; cursor: pointer; font: 10px/1.2 system-ui, sans-serif; min-width: 0; }
        .swatch:hover { background: #303036; }
        .swatch.on { border-color: #4a6cf7; background: #2b3150; color: #fff; }
        .swatch canvas { width: 100%; aspect-ratio: 1; border-radius: 50%; }
        .swatch span { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
        .swatch i { position: absolute; top: 3px; right: 3px; padding: 0 4px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #9a9; font: 9px/1.5 ui-monospace, monospace; font-style: normal; }
        .note { color: #888; font-size: 11px; margin: 8px 0 0; }
        .bench { margin-top: 8px; border-top: 1px solid #3a3a40; padding-top: 8px; }
        .bench button { width: 100%; padding: 5px; border: 1px solid #444; border-radius: 5px; background: #2e2e33; color: #eee; cursor: pointer; font: inherit; }
        #benchmark-images { display: flex; gap: 8px; margin-top: 6px; }
        #benchmark-images img { width: 80px; height: 80px; border-radius: 4px; background: #222; }
        #benchmark-result { white-space: pre-wrap; margin: 6px 0 0; font-size: 11px; }
        @media (max-width: 600px) {
            #lab { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 50%; }
            #palette { grid-template-columns: repeat(6, 1fr); }
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<noscript>This threepipe example needs JavaScript. Its source and instructions for agents: <a href="../llms.txt">llms.txt</a></noscript>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>
<div id="lab">
    <h3>Material lab</h3>
    <div class="active">
        <canvas id="large" width="256" height="256"></canvas>
        <div>
            <small>On the vase</small>
            <b id="active-name"></b>
            <span id="active-time"></span>
        </div>
    </div>
    <div id="palette"></div>
    <p class="note">The animated materials change in every frame: their previews render at most every <i>dragInterval</i> ms (Tweakpane UI, Material Previews). The number counts the renders of each preview.</p>
    <div class="bench">
        <button id="benchmark">Benchmark: offscreen vs full canvas</button>
        <pre id="benchmark-result"></pre>
        <div id="benchmark-images"></div>
    </div>
</div>

</body>
</html>
