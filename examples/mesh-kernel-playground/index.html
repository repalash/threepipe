<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mesh Kernel Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs",
          "@threepipe/plugin-tweakpane": "./../../plugins/tweakpane/dist/index.mjs",
          "@threepipe/mesh-kernel": "./../../plugins/mesh-kernel/dist/index.mjs"
        }
    }
    </script>
    <style id="example-style">
        html, body, #canvas-container, #mcanvas {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 260px;
            padding: 12px;
            background: rgba(20, 20, 24, 0.86);
            border-radius: 8px;
            color: #e6e6ea;
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            backdrop-filter: blur(6px);
        }
        #panel h2 {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
        }
        #panel button {
            display: block;
            width: 100%;
            margin: 4px 0;
            padding: 6px 8px;
            border: 1px solid #3a3a44;
            border-radius: 5px;
            background: #26262e;
            color: #e6e6ea;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }
        #panel button:hover { background: #32323c; }
        #panel button:active { background: #3d3d48; }
        #panel .sep { margin: 10px 0 4px; color: #8a8a96; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; }
        #stats { margin-top: 10px; padding-top: 8px; border-top: 1px solid #3a3a44; white-space: pre-line; color: #b9b9c4; }
        #stats .bad { color: #ff8a8a; }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script type="module" src="../examples-utils/simple-code-preview.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>

<div id="panel">
    <h2>Mesh Kernel Playground</h2>

    <div class="sep">Start from</div>
    <button data-op="cube">Cube</button>
    <button data-op="ngon">12-gon</button>
    <button data-op="grid">Grid 4&times;4</button>

    <div class="sep">Topology</div>
    <button data-op="subdivide">Split every edge</button>
    <button data-op="triangulate">Split every face</button>
    <button data-op="dissolve">Dissolve an edge</button>
    <button data-op="poke">Poke faces (fan)</button>

    <div class="sep">Check</div>
    <button data-op="validate">Validate</button>
    <button data-op="roundtrip">Round trip through BMesh</button>
    <button data-op="reset">Reset</button>

    <div id="stats">loading…</div>
</div>

</body>
</html>
