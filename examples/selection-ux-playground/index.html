<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection UX Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        :root {
            --ui-bg: #ffffff;
            --ui-fg: #1e1e1e;
            --ui-dim: #757575;
            --ui-line: #e6e6e6;
            --accent: #0d99ff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 11px;
            color: var(--ui-fg);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #e3e6eb;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
        }
        #mcanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .panel {
            position: absolute;
            background: var(--ui-bg);
            overflow: auto;
            box-sizing: border-box;
            user-select: none;
        }
        /* a floating card like the layers panel (Figma UI3), below the toolbar, as tall as its content */
        #inspector {
            right: 10px; top: 60px; width: 240px; max-height: calc(100% - 120px); z-index: 11; border-radius: 8px; padding-bottom: 6px;
            box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.10);
        }

        /* inspector */
        #inspector h3 {
            margin: 0;
            padding: 12px 12px 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #inspector h3 small { font-weight: 400; color: var(--ui-dim); }
        .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 2px 12px 6px; }
        .num {
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            border-radius: 4px;
            background: #f5f5f5;
            height: 24px;
        }
        .num:hover { border-color: var(--ui-line); }
        .num:focus-within { border-color: var(--accent); background: #fff; }
        .num span { width: 18px; text-align: center; color: var(--ui-dim); cursor: ew-resize; flex: none; }
        .num input { width: 100%; min-width: 0; border: 0; background: transparent; font: inherit; outline: none; padding: 0 4px 0 0; }
        .insp-empty { color: var(--ui-dim); padding: 4px 12px 10px; }
        .insp-geo { margin: 0 12px 6px; width: calc(100% - 24px); border: 1px solid var(--ui-line); background: #fff; border-radius: 5px; padding: 6px; font: inherit; cursor: pointer; }
        .insp-geo:hover { border-color: var(--accent); }
        .sub { padding: 6px 12px 2px; color: var(--ui-dim); }
        .sub small { margin-left: 4px; opacity: .8; }
        .insp-row { display: flex; align-items: center; gap: 10px; padding: 4px 12px 8px; }
        .insp-row input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--ui-line); border-radius: 4px; background: none; cursor: pointer; }
        .insp-row input[type=color]:disabled { opacity: .35; cursor: default; }
        .insp-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .insp-empty { order: 2; }

        /* below the toolbar */
        #canvas-container .sux-side { top: 60px; }
        body.tb-expanded #canvas-container { inset: 0; }
        @media (max-width: 800px) {
            #canvas-container { inset: 0 0 35% 0; }
            .sux-side { display: none !important; }
            #inspector { top: 65%; right: 0; bottom: 0; width: 100%; max-height: none; border-radius: 0; box-shadow: none; border-top: 1px solid var(--ui-line); }
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
</head>
<body>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
</div>
<div id="inspector" class="panel"></div>
</body>
</html>
