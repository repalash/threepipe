<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection UX Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
          "threepipe": "./../../dist/index.mjs"
        }
    }

    </script>
    <style id="example-style">
        :root {
            --ui-bg: #ffffff;
            --ui-fg: #1e1e1e;
            --ui-dim: #757575;
            --ui-line: #e6e6e6;
            --ui-hover: #f2f2f2;
            --ui-sel: #e5f4ff;
            --ui-sel-parent: #f3faff;
            --accent: #0d99ff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 11px;
            color: var(--ui-fg);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #eef0f3;
        }
        #canvas-container {
            position: absolute;
            inset: 0 280px 0 240px;
        }
        #mcanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .panel {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--ui-bg);
            overflow: auto;
            box-sizing: border-box;
            user-select: none;
        }
        #layers { left: 0; width: 240px; bottom: 300px; border-right: 1px solid var(--ui-line); }
        #notes {
            left: 0;
            width: 240px;
            top: auto;
            height: 300px;
            border-right: 1px solid var(--ui-line);
            border-top: 1px solid var(--ui-line);
            display: flex;
            flex-direction: column;
            user-select: text;
        }
        #notes textarea {
            flex: 1;
            margin: 0 12px;
            border: 1px solid var(--ui-line);
            border-radius: 6px;
            padding: 8px;
            font: inherit;
            line-height: 1.5;
            resize: none;
            outline: none;
            background: #fffdf3;
        }
        #notes textarea:focus { border-color: var(--accent); }
        #notes .btns { padding: 6px 12px 10px; }
        #notes-status { color: var(--ui-dim); }
        #settings { right: 0; width: 280px; border-left: 1px solid var(--ui-line); }
        .panel h3 {
            margin: 0;
            padding: 12px 12px 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel h3 small { font-weight: 400; color: var(--ui-dim); }
        .section { border-bottom: 1px solid var(--ui-line); padding-bottom: 8px; }

        /* layers */
        .row {
            display: flex;
            align-items: center;
            height: 28px;
            padding-right: 8px;
            cursor: default;
            white-space: nowrap;
        }
        .row:hover { background: var(--ui-hover); box-shadow: inset 0 0 0 1px var(--accent); }
        .row.parent-of-sel { background: var(--ui-sel-parent); }
        .row.sel { background: var(--ui-sel); }
        .row.hidden-obj .name { opacity: 0.4; }
        .row .caret { width: 16px; text-align: center; color: var(--ui-dim); flex: none; font-size: 9px; }
        .row .icon { width: 16px; text-align: center; color: var(--ui-dim); flex: none; margin-right: 4px; }
        .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .row .eye { visibility: hidden; color: var(--ui-dim); padding: 2px 4px; border-radius: 3px; }
        .row:hover .eye, .row.hidden-obj .eye { visibility: visible; }
        .row .eye:hover { background: #e2e2e2; }

        /* settings */
        .field { display: flex; align-items: center; padding: 3px 12px; gap: 8px; min-height: 24px; }
        .field > label:not(.toggle) { width: 84px; flex: none; color: var(--ui-dim); }
        .seg { display: flex; flex: 1; background: #f0f0f0; border-radius: 5px; padding: 2px; gap: 2px; flex-wrap: wrap; }
        .seg button {
            flex: 1;
            border: 0;
            background: transparent;
            border-radius: 4px;
            padding: 4px 4px;
            font: inherit;
            color: var(--ui-dim);
            cursor: pointer;
            white-space: nowrap;
        }
        .seg button.on { background: #fff; color: var(--ui-fg); box-shadow: 0 0 0 1px #e0e0e0; }
        .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 8px; }
        .presets button {
            border: 1px solid var(--ui-line);
            background: #fff;
            border-radius: 6px;
            padding: 8px;
            text-align: left;
            font: inherit;
            cursor: pointer;
            line-height: 1.35;
        }
        .presets button b { display: block; font-weight: 600; }
        .presets button span { color: var(--ui-dim); }
        .presets button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .toggle { flex: 1; display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ui-fg); }
        .toggle input { margin: 0; accent-color: var(--accent); }
        .btns { display: flex; gap: 6px; padding: 4px 12px 8px; flex-wrap: wrap; }
        .btns button {
            border: 1px solid var(--ui-line);
            background: #fff;
            border-radius: 5px;
            padding: 5px 8px;
            font: inherit;
            cursor: pointer;
        }
        .btns button:hover { background: var(--ui-hover); }

        /* inspector */
        .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 2px 12px 6px; }
        .num {
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            border-radius: 4px;
            background: #f5f5f5;
            height: 24px;
        }
        .num:hover { border-color: var(--ui-line); }
        .num:focus-within { border-color: var(--accent); background: #fff; }
        .num span { width: 18px; text-align: center; color: var(--ui-dim); cursor: ew-resize; flex: none; }
        .num input { width: 100%; min-width: 0; border: 0; background: transparent; font: inherit; outline: none; padding: 0 4px 0 0; }
        .insp-empty { color: var(--ui-dim); padding: 4px 12px 10px; }
        .sub { padding: 6px 12px 2px; color: var(--ui-dim); }

        /* overlay labels (drawn by SelectionUxPlugin) */
        .sux-name, .sux-dims {
            position: absolute;
            left: 0;
            top: 0;
            white-space: nowrap;
            font-size: 11px;
            line-height: 16px;
        }
        .sux-name { color: var(--sux-accent); pointer-events: auto; font-weight: 500; }
        .sux-crumb { opacity: 0.65; cursor: pointer; }
        .sux-crumb:hover { opacity: 1; text-decoration: underline; }
        .sux-sep { opacity: 0.4; margin: 0 4px; }
        .sux-dims {
            background: var(--sux-accent);
            color: #fff;
            border-radius: 3px;
            padding: 0 5px;
            font-variant-numeric: tabular-nums;
        }

        #hint {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.86);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
        }
        #hint kbd, #help kbd {
            font: inherit;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 3px;
            padding: 0 4px;
        }
        #toast {
            position: absolute;
            left: 50%;
            top: 14px;
            transform: translateX(-50%) translateY(-8px);
            background: #1e1e1e;
            color: #fff;
            padding: 7px 12px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity .15s, transform .15s;
            pointer-events: none;
            z-index: 10;
        }
        #toast.show { opacity: 1; transform: translateX(-50%); }
        #help {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #help.show { display: flex; }
        #help .card {
            background: #1e1e1e;
            color: #fff;
            border-radius: 12px;
            padding: 18px 22px;
            max-width: 720px;
            columns: 2;
            column-gap: 32px;
            line-height: 1.9;
        }
        #help .card h4 { margin: 0 0 4px; font-size: 12px; break-after: avoid; }
        #help .card div { display: flex; justify-content: space-between; gap: 16px; break-inside: avoid; }
        #help .card div span:first-child { color: #bbb; }

        @media (max-width: 800px) {
            #canvas-container { inset: 0 0 40% 0; }
            #layers, #notes { display: none; }
            #settings { top: 60%; width: 100%; border-left: 0; border-top: 1px solid var(--ui-line); }
            #hint { display: none; }
        }
    </style>
    <script type="module" src="../examples-utils/global-loading.mjs"></script>
    <script id="example-script" type="module" src="./script.js" data-scripts="./script.ts;./script.js"></script>
</head>
<body>
<div id="layers" class="panel">
    <h3>Layers <small>click · shift · ⌘</small></h3>
    <div id="layer-tree"></div>
</div>
<div id="notes" class="panel">
    <h3>Notes <small id="notes-status"></small></h3>
    <textarea id="notes-text" placeholder="Feedback, ideas, bugs… Saved automatically. “+ Context” adds the current variant and selection."></textarea>
    <div class="btns">
        <button id="notes-context" title="Insert the current preset, look and selection">+ Context</button>
        <button id="notes-copy">Copy</button>
    </div>
</div>
<div id="canvas-container">
    <canvas id="mcanvas"></canvas>
    <div id="hint"></div>
    <div id="toast"></div>
</div>
<div id="settings" class="panel"></div>
<div id="help"><div class="card" id="help-card"></div></div>
</body>
</html>
